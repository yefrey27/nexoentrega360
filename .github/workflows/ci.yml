name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  specs-y-contratos:
    name: SPECS y contratos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "SPECS - el JSON generado coincide con la fuente"
        run: python3 scripts/export_specs.py --check
      - name: "Contratos - OpenAPI y esquema de salida de IA"
        run: |
          pip install openapi-spec-validator==0.9.0 jsonschema==4.26.0 pyyaml==6.0.3
          python3 scripts/validate_contracts.py

  api-con-base-real:
    name: API con PostgreSQL 16.4 real
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:16.4
        env:
          POSTGRES_USER: nexo_owner
          POSTGRES_PASSWORD: ci-owner-pass
          POSTGRES_DB: nexoentrega
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexo_owner -d nexoentrega"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGPASSWORD: ci-owner-pass
      POSTGRES_USER: nexo_owner
      POSTGRES_DB: nexoentrega
      NEXO_APP_PASSWORD: ci-app-pass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Instalación reproducible
        working-directory: apps/api
        run: npm ci
      - name: Sintaxis de los módulos de la API
        working-directory: apps/api
        run: for f in src/*.js test/*.js; do node --check "$f"; done
      - name: Rol de la aplicación, migraciones y seed
        env:
          DATABASE_URL: postgres://nexo_owner:ci-owner-pass@127.0.0.1:5432/nexoentrega
        run: |
          bash infra/initdb/01-roles.sh
          bash scripts/migrate.sh
          bash scripts/seed.sh
      - name: Pruebas de integración contra la base real
        working-directory: apps/api
        env:
          OWNER_DATABASE_URL: postgres://nexo_owner:ci-owner-pass@127.0.0.1:5432/nexoentrega
          DATABASE_URL: postgres://nexo_app:ci-app-pass@127.0.0.1:5432/nexoentrega
        run: |
          mkdir -p ../../ci-out
          { psql -d nexoentrega -Atc 'select version()'; node -v; } | tee ../../ci-out/entorno.txt
          npm test 2>&1 | tee ../../ci-out/npm-test.txt
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-ci-${{ github.sha }}
          path: ci-out/

  dependencias:
    name: Revisión de dependencias
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit (alto o crítico)
        working-directory: apps/api
        # Hallazgo abierto: express 4.21.2 con 2 vulnerabilidades altas.
        # No bloquea mientras no se actualice; el aviso queda visible en el PR.
        continue-on-error: true
        run: npm audit --audit-level=high

  secretos:
    name: Detección de secretos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
